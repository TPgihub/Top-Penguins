<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcular Total</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container py-5">
    <h2 class="mb-4">Calculadora de Total</h2>

    <!-- Formulario -->
    <div class="mb-3">
      <label for="precio" class="form-label">Precio unitario (Lps)</label>
      <input type="number" id="precio" class="form-control" placeholder="Ingrese el precio del producto">
    </div>

    <div class="mb-3">
      <label for="cantidad" class="form-label">Cantidad</label>
      <input type="number" id="cantidad" class="form-control" placeholder="Ingrese la cantidad">
    </div>

    <button id="btnCalcular" class="btn btn-primary">Calcular total</button>

    <!-- Resultado -->
    <div id="resultado" class="alert alert-info mt-4 d-none"></div>
  </div>

  <script>
    // Función para calcular el total
    function calcularTotal() {
      const precio = parseFloat(document.getElementById('precio').value) || 0;
      const cantidad = parseInt(document.getElementById('cantidad').value) || 0;
      const total = precio * cantidad;

      const resultado = document.getElementById('resultado');

      if (total > 0) {
        resultado.textContent = `Total a pagar: Lps ${total.toFixed(2)}`;
        resultado.classList.remove('d-none', 'alert-danger');
        resultado.classList.add('alert-info');
      } else {
        resultado.textContent = 'Ingrese valores válidos';
        resultado.classList.remove('d-none', 'alert-info');
        resultado.classList.add('alert-danger');
      }
    }

    // Asignar el evento al botón
    document.getElementById('btnCalcular').addEventListener('click', calcularTotal);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
